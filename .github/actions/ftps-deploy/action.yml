name: FTPS deploy with retry
description: >-
  ./site/ をFTPSでサーバへアップロードする。レンタルサーバーのFTPSは
  一時的にDNS解決失敗（getaddrinfo ENOTFOUND）や接続タイムアウトを起こすことが
  あるため、失敗時は最大3回まで再試行する。
  再試行の前には待機を入れる（60秒→120秒）。障害は数分続くことがあり、
  間隔を空けずに叩き直すと3回とも同じ数十秒の障害窓に収まって全滅するため
  （2026-08-09/10/12 に発生。3回とも control socket timeout で約90秒以内に失敗）。
inputs:
  server:
    description: FTPサーバホスト（FTP_SERVER）
    required: true
  username:
    description: FTPユーザー名（FTP_USERNAME）
    required: true
  password:
    description: FTPパスワード（FTP_PASSWORD）
    required: true
  server-dir:
    description: アップロード先ディレクトリ（末尾スラッシュ必須・FTP_REMOTE_DIR）
    required: true
runs:
  using: composite
  steps:
    - name: FTPS upload (1回目)
      id: try1
      continue-on-error: true
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ inputs.server }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
        protocol: ftps
        local-dir: ./site/
        server-dir: ${{ inputs.server-dir }}
    - name: 再試行前の待機（60秒）
      if: steps.try1.outcome == 'failure'
      shell: bash
      run: sleep 60

    - name: FTPS upload (2回目)
      id: try2
      if: steps.try1.outcome == 'failure'
      continue-on-error: true
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ inputs.server }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
        protocol: ftps
        local-dir: ./site/
        server-dir: ${{ inputs.server-dir }}
    - name: 再試行前の待機（120秒）
      if: steps.try1.outcome == 'failure' && steps.try2.outcome == 'failure'
      shell: bash
      run: sleep 120

    - name: FTPS upload (3回目)
      if: steps.try1.outcome == 'failure' && steps.try2.outcome == 'failure'
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ inputs.server }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
        protocol: ftps
        local-dir: ./site/
        server-dir: ${{ inputs.server-dir }}
